# Codex-specific metadata for the Agent Skills / Agent Plugins standard.
name: pixel-art
short_description: Hand-crafted pixel art from references and a description.
entrypoint: bin/px
tags: [pixel-art, sprites, game-art, animation, palette, aseprite, lospec]
